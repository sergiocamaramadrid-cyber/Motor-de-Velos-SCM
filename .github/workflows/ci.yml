name: CI - SCM Framework

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.11" ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          test -f requirements.txt || { echo "ERROR: requirements.txt is required for CI dependency installation. Ensure it exists at repository root."; exit 1; }
          pip install -r requirements.txt
          pip install pytest

      - name: Lint (syntax/compile smoke)
        run: |
          python -m compileall -q scripts src tests

      - name: Run tests
        run: |
          bash -n scripts/run_all_sparc_veil_test.sh
          pytest -q

      - name: Dataset validation
        run: |
          python scripts/validate_sparc_catalog.py --input data/sparc_175_master_sample.csv --out results/validation/sparc_catalog_validation_report.csv
          test -f results/validation/sparc_catalog_validation_report.csv

      - name: Regression smoke test
        run: |
          python scripts/fit_f3_linear_regression.py --input data/sparc_175_master_sample.csv --summary-out results/regression/f3_regression_summary.csv
          test -f results/regression/f3_regression_summary.csv

      - name: Run ΔF3 persistence pipeline (synthetic)
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path

          out_path = Path("results/ci_delta_f3_synthetic.csv")
          out_path.parent.mkdir(parents=True, exist_ok=True)
          rows = []
          for galaxy, offset in [("G1", 0.0), ("G2", 0.4)]:
              for r_kpc, f3 in [
                  (1, 1.0 + offset),
                  (2, 1.4 + offset),
                  (3, 2.0 + offset),
                  (4, 2.9 + offset),
                  (5, 4.1 + offset),
              ]:
                  rows.append(
                      {
                          "galaxy": galaxy,
                          "r_kpc": r_kpc,
                          "F3": f3,
                          "fit_ok": True,
                          "reliable": True,
                      }
                  )
          pd.DataFrame(rows).to_csv(out_path, index=False)
          PY

          python analisis_persistencia_delta_f3.py \
            --input results/ci_delta_f3_synthetic.csv \
            --mode intra-galaxy \
            --filter-fit-ok \
            --filter-reliable \
            --outdir results/delta_f3_persistence_ci

          test -f results/delta_f3_persistence_ci/delta_f3_pairs.csv
          test -f results/delta_f3_persistence_ci/delta_f3_model_comparison.csv
          test -f results/delta_f3_persistence_ci/delta_f3_persistence_fit.png
